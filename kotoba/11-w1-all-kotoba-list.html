<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>言葉の王国 — Daftar Kotoba &amp; Kanji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2415; --moss:#3f5f2a; --moss-d:#1f3216;
  --gold:#c9a94a; --gold-l:#ecdc9a; --gold-d:#7d6a26;
  --parch:#efe8c4;
  --jp:"Noto Serif JP","Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho","Songti SC",serif;
  --title:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;
  --text:"Cormorant Garamond","Palatino Linotype","Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{min-height:100vh;color:var(--parch);font-family:var(--text);background:#14110d}
#wall{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:80px}

/* ---------- Header ---------- */
header{width:min(880px,100%);padding:34px 18px 10px;text-align:center}
.crown{width:86px;height:64px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
h1{margin:6px 0 0;font-family:var(--jp);font-weight:900;font-size:clamp(2.1rem,7vw,3.4rem);letter-spacing:.08em;
  background:linear-gradient(#f6ecb8,#c9a94a 45%,#7d6a26);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.55))}
.sub{margin:4px 0 0;font-family:var(--title);letter-spacing:.2em;font-size:clamp(.7rem,2.4vw,.95rem);color:var(--gold-l);text-transform:uppercase}
.src{margin:4px 0 0;color:#e2dab0;font-size:1rem;font-style:italic}

/* ---------- Bar lengket ---------- */
.bar{position:sticky;top:0;z-index:5;width:100%;display:flex;justify-content:center;
  padding:10px 12px;background:linear-gradient(rgba(18,16,12,.96),rgba(18,16,12,.82) 70%,rgba(18,16,12,0))}
.bar-in{width:min(880px,100%);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stat{font-family:var(--title);font-size:.95rem;letter-spacing:.08em;color:var(--gold-l);white-space:nowrap}
.stat b{font-size:1.3rem;color:#f6ecb8}
.track{flex:1;min-width:120px;height:9px;border-radius:99px;background:rgba(0,0,0,.55);
  border:1px solid rgba(201,169,74,.5);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(#e9d88a,#a58c3a);transition:width .35s ease}
.btn{font-family:var(--title);font-weight:700;letter-spacing:.06em;font-size:.8rem;color:var(--gold-l);
  background:linear-gradient(#557a3a,#243a1a);border:2px solid var(--gold);border-radius:99px;padding:7px 15px;cursor:pointer;
  box-shadow:0 3px 0 #0c1608,0 8px 16px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0c1608}
.btn:focus-visible{outline:3px solid var(--gold-l);outline-offset:3px}

/* ---------- Daftar ---------- */
.list{width:min(880px,100%);padding:6px 12px 0;display:flex;flex-direction:column;gap:9px}
.day{margin:20px 0 4px;align-self:center;padding:7px 30px;border-radius:99px;
  font-family:var(--title);font-weight:700;letter-spacing:.14em;font-size:.78rem;color:var(--gold-l);
  background:linear-gradient(#557a3a,#243a1a);border:2px solid var(--gold);
  box-shadow:0 4px 0 #0c1608,0 10px 20px rgba(0,0,0,.5),inset 0 0 0 1px rgba(245,220,138,.25)}
.day:first-child{margin-top:6px}

.row{display:flex;align-items:center;gap:13px;padding:9px 12px 9px 10px;border-radius:99px;
  background:linear-gradient(90deg,rgba(87,124,60,.5),rgba(34,52,24,.6) 48%,rgba(18,26,13,.72));
  border:2px solid rgba(201,169,74,.5);
  box-shadow:inset 0 0 0 1px rgba(245,220,138,.1),0 6px 16px rgba(0,0,0,.42);
  transition:transform .18s,box-shadow .18s,filter .18s,opacity .32s,height .32s,padding .32s,margin .32s,border-width .32s,background .2s}
.row:hover{transform:translateX(4px);filter:brightness(1.14);
  box-shadow:inset 0 0 0 1px rgba(245,220,138,.2),0 8px 22px rgba(0,0,0,.5),0 0 22px rgba(212,175,55,.28)}

.num{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;
  font-family:var(--title);font-weight:700;font-size:.82rem;color:var(--gold-l);
  background:radial-gradient(circle at 40% 30%,#4f7336,#1a2a10);
  border:2px solid rgba(201,169,74,.8);box-shadow:inset 0 0 10px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.jp{font-family:var(--jp);font-weight:900;font-size:clamp(1.15rem,3.6vw,1.5rem);line-height:1.25;color:#f6ecb8;
  text-shadow:0 1px 0 rgba(0,0,0,.6);word-break:break-word}
.line2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.rom{font-family:var(--text);font-style:italic;font-weight:700;font-size:1rem;color:var(--gold);letter-spacing:.02em}
.mean{font-family:var(--text);font-weight:600;font-size:1rem;color:#e4dfb4}
.dash{color:rgba(201,169,74,.6)}
.tag{flex:none;font-family:var(--title);font-weight:700;letter-spacing:.1em;font-size:.62rem;padding:3px 9px;border-radius:99px;
  border:1px solid rgba(201,169,74,.55);color:#dfe6b8;background:rgba(0,0,0,.3);white-space:nowrap}
.tag.kanji{color:#f7dcae;border-color:rgba(220,150,90,.6)}
.tag.jukugo{color:#cfe6f0;border-color:rgba(120,175,200,.5)}

/* ---------- Centang ---------- */
.check{flex:none;width:42px;height:42px;border-radius:50%;cursor:pointer;padding:0;display:grid;place-items:center;
  border:2px solid rgba(201,169,74,.85);background:radial-gradient(circle at 40% 30%,rgba(31,50,22,.9),rgba(12,20,8,.9));
  color:transparent;transition:transform .15s,background .2s,color .2s,box-shadow .2s,filter .15s}
.check svg{width:22px;height:22px;stroke:currentColor;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.check:hover{transform:scale(1.1);color:rgba(236,220,154,.45);filter:brightness(1.2);box-shadow:0 0 16px rgba(212,175,55,.45)}
.check:active{transform:scale(.94)}
.check:focus-visible{outline:3px solid var(--gold-l);outline-offset:3px}
.row.checked .check{color:#2a2408;background:linear-gradient(#e9d88a,#a58c3a);box-shadow:0 0 18px rgba(233,216,138,.65)}
.row.gone{opacity:0;transform:translateX(60px) scale(.97);height:0!important;padding-top:0;padding-bottom:0;margin-top:-9px;border-width:0}

.empty{display:none;width:min(880px,100%);padding:20px 16px;text-align:center;font-size:1.15rem;font-style:italic;color:var(--gold-l)}
.empty.on{display:block}
footer.sig{width:min(880px,100%);padding:26px 16px 0;text-align:center;font-family:var(--title);
  letter-spacing:.22em;font-size:.66rem;color:rgba(236,220,154,.45);text-transform:uppercase}
@media (max-width:520px){
  .row{gap:9px;padding:8px 9px}
  .num{width:32px;height:32px;font-size:.72rem}
  .check{width:38px;height:38px}
  .tag{display:none}
  .jp{font-size:1.1rem}
  .rom,.mean{font-size:.92rem}
}
</style>
</head>

/* ============================================================
   Kana → romaji (Hepburn sederhana)
   ============================================================ */
const KANA = {
  'あ':'a','い':'i','う':'u','え':'e','お':'o',
  'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
  'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
  'た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
  'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
  'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
  'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
  'や':'ya','ゆ':'yu','よ':'yo',
  'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
  'わ':'wa','ゐ':'i','ゑ':'e','を':'o','ん':'n',
  'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go',
  'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
  'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do',
  'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
  'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
  'ゔ':'vu','ゎ':'wa','ゕ':'ka','ゖ':'ke',
  'ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o',
  'ゃ':'ya','ゅ':'yu','ょ':'yo','っ':'','ー':'-','・':' ','　':' '
};
const DIGRAPH = {
  'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho',
  'ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo',
  'ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo',
  'りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
  'じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo',
  'ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo','ぢゃ':'ja','ぢゅ':'ju','ぢょ':'jo',
  'ふぁ':'fa','ふぃ':'fi','ふぇ':'fe','ふぉ':'fo',
  'てぃ':'ti','でぃ':'di','とぅ':'tu','どぅ':'du',
  'うぃ':'wi','うぇ':'we','うぉ':'wo','ゔぁ':'va','ゔぃ':'vi','ゔぇ':'ve','ゔぉ':'vo',
  'しぇ':'she','ちぇ':'che','じぇ':'je'
};
const toHira = s => s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const unit = (s, i) => {
  const two = s.slice(i, i + 2);
  if (DIGRAPH[two]) return { r: DIGRAPH[two], n: 2 };
  const one = s[i];
  if (KANA[one] !== undefined) return { r: KANA[one], n: 1 };
  return { r: one, n: 1 };
};
function romaji(src) {
  const s = toHira(String(src || ''));
  let out = '';
  for (let i = 0; i < s.length;) {
    const c = s[i];
    if (c === 'っ') {                                   // sokuon: gandakan konsonan berikut
      const nx = unit(s, i + 1).r;
      if (nx && /^[a-z]/.test(nx)) out += /^ch/.test(nx) ? 't' : nx[0];
      i++; continue;
    }
    if (c === 'ー') {                                   // vokal panjang
      const m = out.match(/[aeiou]$/);
      if (m) out += m[0];
      i++; continue;
    }
    if (c === 'ん') {                                   // n, pakai apostrof sebelum vokal / y
      const nx = unit(s, i + 1).r;
      out += 'n' + (nx && /^[aeiouy]/.test(nx) ? "'" : '');
      i++; continue;
    }
    const u = unit(s, i);
    out += u.r; i += u.n;
  }
  return out.replace(/\s+/g, ' ').trim();
}

const KEY = 'renshuu-allkotoba-sembunyi-v1';

const $ = s => document.querySelector(s);
const list = $('#list'), sisaEl = $('#sisa'), fillEl = $('#fill'), emptyEl = $('#empty');
let hidden = new Set();
try { hidden = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { hidden = new Set(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...hidden])); } catch (e) {} };

let rows = [];
function build() {
  list.innerHTML = '';
  rows = ALL.map((c, i) => ({ c, i })).filter(({ i }) => !hidden.has(i));
  let day = null;
  rows.forEach(({ c, i }, n) => {
    if (c.d !== day) {
      day = c.d;
      const h = document.createElement('div');
      h.className = 'day';
      h.textContent = day;
      list.appendChild(h);
    }
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.i = i;
    row.innerHTML =
      '<span class="num">' + (i + 1) + '</span>' +
      '<span class="txt">' +
        '<span class="jp"></span>' +
        '<span class="line2"><span class="rom"></span><span class="dash">—</span><span class="mean"></span></span>' +
      '</span>' +
      '<span class="tag ' + c.t + '">' + TYPE[c.t] + '</span>' +
      '<button class="check" type="button" aria-label="Tandai sudah hafal: ' + c.jp + '" title="Sudah hafal">' +
        '<svg viewBox="0 0 24 24"><path d="M4 12.5 L9.5 18 L20 6.5"/></svg>' +
      '</button>';
    row.querySelector('.jp').textContent = c.jp;
    row.querySelector('.rom').textContent = romaji(c.r) || c.r;
    row.querySelector('.mean').textContent = c.m;
    list.appendChild(row);
  });
  update();
}

function update() {
  const total = ALL.length, left = total - hidden.size;
  sisaEl.textContent = left;
  $('#total').textContent = total;
  fillEl.style.width = ((total - left) / total * 100).toFixed(2) + '%';
  emptyEl.classList.toggle('on', left === 0);
}

function tick(btn) {
  const row = btn.closest('.row');
  const i = Number(row.dataset.i);
  if (hidden.has(i)) return;
  hidden.add(i);
  save();
  row.classList.add('checked');
  update();
  // tinggi dikunci dulu, paksa reflow, baru animasikan ke 0 & hapus dari DOM
  row.style.height = row.offsetHeight + 'px';
  row.style.overflow = 'hidden';
  void row.offsetHeight;
  row.classList.add('gone');
  setTimeout(() => { row.remove(); }, 360);
}

list.addEventListener('click', e => {
  const btn = e.target.closest('.check');
  if (!btn) return;
  tick(btn);
});

$('#reset').addEventListener('click', () => {
  hidden.clear();
  save();
  build();
});

build();

/* ============================================================
   Latar: tembok kastil bata/batu tua berlumut (digambar di canvas)
   ============================================================ */
(function wall() {
  const cv = document.getElementById('wall'), ctx = cv.getContext('2d');
  const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  let lastW = 0, lastH = 0;

  function draw() {
    const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
    lastW = W; lastH = H;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const R = mulberry(1337), rr = (a, b) => a + (b - a) * R(), pick = a => a[Math.floor(R() * a.length)];
    const S = Math.max(.7, Math.min(1.3, W / 1100));

    ctx.fillStyle = '#12100c'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < W * H / 900; i++) {
      ctx.fillStyle = R() < .5 ? 'rgba(255,240,210,.05)' : 'rgba(0,0,0,.25)';
      ctx.fillRect(R() * W, R() * H, 1.5, 1.5);
    }

    const bricks = [], rows = [];
    for (let y = -8; y < H;) {
      const h = Math.round(rr(46, 62) * S);
      for (let x = -rr(0, 120) * S; x < W;) { const w = Math.round(rr(96, 178) * S); bricks.push({ x, y, w, h }); x += w; }
      y += h; rows.push(y);
    }
    const PAL = [[30, 11, 32], [34, 13, 29], [26, 9, 35], [38, 9, 33], [205, 7, 32], [28, 15, 26], [42, 10, 30]];
    bricks.forEach(({ x, y, w, h }) => {
      const g = 3, j = () => rr(-1.6, 1.6);
      const x0 = x + g + j(), y0 = y + g + j(), x1 = x + w - g + j(), y1 = y + h - g + j();
      const [hh, ss, ll] = pick(PAL), L = ll + rr(-4, 5), Hh = hh + rr(-4, 4);
      const grd = ctx.createLinearGradient(x0, y0, x1, y1);
      grd.addColorStop(0, `hsl(${Hh},${ss}%,${L + 5}%)`); grd.addColorStop(1, `hsl(${Hh},${ss + 2}%,${L - 6}%)`);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0 + j()); ctx.lineTo(x1 + j(), y1); ctx.lineTo(x0 + j(), y1 + j()); ctx.closePath();
      ctx.fillStyle = grd; ctx.fill();
      ctx.save(); ctx.clip();
      for (let i = 0, n = (x1 - x0) * (y1 - y0) / 45; i < n; i++) {
        ctx.fillStyle = R() < .6 ? `rgba(0,0,0,${rr(.05, .16)})` : `rgba(255,235,200,${rr(.03, .09)})`;
        const s = rr(.6, 1.8); ctx.fillRect(rr(x0, x1), rr(y0, y1), s, s);
      }
      if (R() < .35) {
        const sl = rr(.4, 1) * (y1 - y0), sg = ctx.createLinearGradient(0, y0, 0, y0 + sl);
        sg.addColorStop(0, 'rgba(0,0,0,.22)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sg; ctx.fillRect(rr(x0, x1 - 8), y0, rr(6, 22), sl);
      }
      ctx.fillStyle = 'rgba(255,235,200,.13)'; ctx.fillRect(x0, y0, x1 - x0, 1.5);
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(x0, y1 - 2.5, x1 - x0, 2.5);
      ctx.restore();
      if (R() < .14) {
        let cx = rr(x0 + 8, x1 - 8), cy = y0 + 2;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        for (let k = 0; k < 4; k++) { cx += rr(-9, 9); cy += (y1 - y0) / 4; ctx.lineTo(cx, cy); }
        ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.1; ctx.stroke();
      }
    });

    function moss(cx, cy, s) {
      const sh = ctx.createRadialGradient(cx, cy, 0, cx, cy, s * 1.25);
      sh.addColorStop(0, 'rgba(6,20,3,.5)'); sh.addColorStop(1, 'rgba(6,20,3,0)');
      ctx.fillStyle = sh; ctx.fillRect(cx - s * 1.3, cy - s * 1.3, s * 2.6, s * 2.6);
      const n = Math.round(s * s / 8) + 12;
      const pass = (count, spread, cols, rmin, rmax) => {
        for (let i = 0; i < count; i++) {
          const a = R() * 6.283, d = Math.pow(R(), .65) * s * spread;
          const r = rr(rmin, rmax) * (1 - .55 * d / (s * spread + 1));
          ctx.fillStyle = pick(cols); ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d * .72 - (spread < .7 ? s * .08 : 0), Math.max(.5, r), 0, 6.283); ctx.fill();
        }
      };
      pass(n, 1.0, ['rgba(28,50,15,.95)', 'rgba(40,68,20,.95)'], 2, 5);
      pass(n * .8, .85, ['rgba(58,98,30,.92)', 'rgba(74,116,36,.92)'], 1.6, 4.2);
      pass(n * .5, .65, ['rgba(104,150,52,.9)', 'rgba(128,170,64,.88)'], 1, 3);
      pass(n * .22, .5, ['rgba(176,204,104,.85)', 'rgba(206,220,140,.75)'], .6, 1.6);
    }
    bricks.forEach(({ x, y, w, h }) => {
      const f = (y + h / 2) / H;
      if (R() < .04 + .55 * f * f * f)
        for (let i = 0, k = 1 + Math.floor(R() * 3); i < k; i++)
          moss(x + rr(.1, .9) * w, R() < .7 ? y + h - 1 : y + rr(.2, .9) * h, rr(9, 26) * S);
    });
    for (let i = 0; i < Math.round(H / 70); i++) {
      const ry = rows[Math.min(rows.length - 1, Math.floor(rows.length * Math.sqrt(R())))], x0 = rr(0, W), len = rr(120, 320) * S;
      for (let x = x0; x < x0 + len; x += 9 * S) moss(x, ry, rr(5, 10) * S);
    }
    for (let x = -10; x < W + 10; x += Math.max(9, 11 * S)) {
      const hgt = H * (.04 + .12 * R() * R() + .05 * (.5 + .5 * Math.sin(x / (90 * S))));
      for (let i = 0, c = 1 + Math.floor(R() * 3); i < c; i++) moss(x + rr(-8, 8), H - rr(0, hgt), rr(12, 30) * S);
    }
    for (let i = 0; i < Math.round(H / 90); i++) moss(R() < .5 ? rr(-5, 12) : W - rr(-5, 12), rr(H * .3, H), rr(12, 28) * S);
    for (let i = 0; i < Math.round(W / 160); i++) moss(rr(0, W), rr(-4, 14), rr(10, 22) * S);

    const vg = ctx.createRadialGradient(W / 2, H * .38, Math.min(W, H) * .15, W / 2, H * .5, Math.max(W, H) * .85);
    vg.addColorStop(0, 'rgba(255,196,120,.07)'); vg.addColorStop(.45, 'rgba(0,0,0,.32)'); vg.addColorStop(1, 'rgba(0,0,0,.78)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  let t; addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => { if (innerWidth !== lastW || Math.abs(innerHeight - lastH) > 150) draw(); }, 200);
  });
  draw();
})();
</script>
